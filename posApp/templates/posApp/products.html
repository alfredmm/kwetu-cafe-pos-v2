<div class="container-fluid">
    <form action="" id="product-form" enctype="multipart/form-data">
        <input type="hidden" name="id" value="{% if product.pk %}{{product.pk}}{% endif %}">
        
        <!-- Image Upload Field -->
        <div class="form-group mb-3">
            <label for="image" class="control-label">Product Image</label>
            <input type="file" name="image" id="image" class="form-control form-control-sm rounded-0" accept="image/*">
            {% if product.image %}
                <div class="mt-2">
                    <img src="{{ product.image.url }}" alt="{{ product.name }}" style="max-height: 150px; max-width: 100%;">
                    <div class="form-check mt-1">
                        <input class="form-check-input" type="checkbox" name="image-clear" id="image-clear">
                        <label class="form-check-label" for="image-clear">Remove current image</label>
                    </div>
                </div>
            {% endif %}
        </div>
        
        <!-- Modified Code Field - Auto-generated and readonly -->
        <div class="form-group mb-3">
            <label for="code" class="control-label">Code</label>
            {% if product.pk %}
                <!-- Existing product - show code as readonly -->
                <input type="text" name="code" id="code" class="form-control form-control-sm rounded-0 bg-light" 
                       value="{{product.code}}" readonly>
            {% else %}
                <!-- New product - show placeholder and make readonly -->
                <input type="text" name="code" id="code" class="form-control form-control-sm rounded-0 bg-light" 
                       value="Auto-generated after save" readonly>
            {% endif %}
        </div>
        
        <!-- Rest of your form fields -->
        <!-- ... -->
    </form>
</div>

<script>
    $(function() {
        $('#product-form').submit(function(e) {
            e.preventDefault();
            var _this = $(this)
            $('.err-msg').remove();
            var el = $('<div>')
            el.addClass("alert alert-danger err-msg")
            el.hide()
            
            // Remove code field validation for new products
            var isNewProduct = !$('input[name="id"]').val();
            if (isNewProduct) {
                $('#code').removeAttr('required');
            }
            
            if (_this[0].checkValidity() == false) {
                _this[0].reportValidity();
                return false;
            }
            start_loader();
            
            // Create FormData object to handle file uploads
            var formData = new FormData($(this)[0]);
            if (isNewProduct) {
                formData.delete('code'); // Remove code field for new products
            }
            
            $.ajax({
                headers: {
                    "X-CSRFToken": '{{csrf_token}}'
                },
                url: "{% url 'save-product-page' %}",
                data: formData,
                cache: false,
                contentType: false,
                processData: false,
                method: 'POST',
                type: 'POST',
                dataType: 'json',
                error: err => {
                    console.log(err)
                    end_loader();
                },
                success: function(resp) {
                    if (typeof resp == 'object' && resp.status == 'success') {
                        el.removeClass("alert alert-danger err-msg")
                        location.reload()
                    } else if (resp.status == 'failed' && !!resp.msg) {
                        el.text(resp.msg)
                    } else {
                        el.text("An error occured", 'error');
                        end_loader();
                        console.err(resp)
                    }
                    _this.prepend(el)
                    el.show('slow')
                    $("html, body, .modal").scrollTop(0);
                    end_loader()
                }
            })
        })
    })
</script>
