{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .image-preview-container {
            margin-top: 10px;
            text-align: center;
        }
        .image-preview {
            max-width: 100%;
            max-height: 200px;
            border: 1px solid #ddd;
            border-radius: 4px;
            padding: 5px;
            margin-bottom: 10px;
        }
        .image-placeholder {
            width: 100%;
            height: 150px;
            background-color: #f8f9fa;
            border: 2px dashed #dee2e6;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #6c757d;
            margin-bottom: 10px;
        }
        .remove-image-btn {
            margin-top: 5px;
        }
        .required-field::after {
            content: "*";
            color: red;
            margin-left: 4px;
        }
    </style>
</head>
<body>
    <div class="container-fluid">
        <form action="" id="product-form" enctype="multipart/form-data">
            {% csrf_token %}
            <input type="hidden" name="id" value="{% if product.pk %}{{product.pk}}{% endif %}">
            
            <!-- Image Upload Field -->
            <div class="form-group mb-3">
                <label for="image" class="control-label">Product Image</label>
                <input type="file" name="image" id="image" class="form-control form-control-sm rounded-0" accept="image/*">
                
                <div class="image-preview-container mt-2">
                    {% if product.image and product.image.url %}
                        <img src="{{ product.image.url }}" alt="{{ product.name }}" class="image-preview" id="image-preview">
                        <div class="form-check mt-1">
                            <input class="form-check-input" type="checkbox" name="image-clear" id="image-clear">
                            <label class="form-check-label" for="image-clear">Remove current image</label>
                        </div>
                    {% else %}
                        <div class="image-placeholder" id="image-placeholder">
                            <div class="text-center">
                                <i class="fas fa-image fa-2x mb-2"></i>
                                <p>No image uploaded</p>
                            </div>
                        </div>
                        <img src="" class="image-preview d-none" id="image-preview">
                    {% endif %}
                </div>
                <small class="form-text text-muted">Recommended size: 500x500 pixels. Max file size: 2MB</small>
            </div>
            
            <!-- Code Field - Auto-generated and readonly -->
            <div class="form-group mb-3">
                <label for="code" class="control-label">Product Code</label>
                {% if product.pk %}
                    <!-- Existing product - show code as readonly -->
                    <input type="text" name="code" id="code" class="form-control form-control-sm rounded-0 bg-light" 
                           value="{{product.code}}" readonly>
                {% else %}
                    <!-- New product - show placeholder and make readonly -->
                    <input type="text" name="code" id="code" class="form-control form-control-sm rounded-0 bg-light" 
                           value="Auto-generated after save" readonly>
                {% endif %}
            </div>
            
            <!-- Category Field -->
            <div class="form-group mb-3">
                <label for="category_id" class="control-label required-field">Category</label>
                <select name="category_id" id="category_id" class="form-select form-select-sm rounded-0" required>
                    {% if not product.category_id %}
                    <option value="" disabled selected>Select a category</option>
                    {% else %}
                    <option value="" disabled>Select a category</option>
                    {% endif %}
                    {% for category in categories %}
                        {% if product.category_id == category.id %}
                        <option value="{{ category.id }}" selected>{{ category.name }}</option>
                        {% else %}
                        <option value="{{ category.id }}">{{ category.name }}</option>
                        {% endif %}
                    {% endfor %}
                </select>
            </div>
            
            <!-- Product Name Field -->
            <div class="form-group mb-3">
                <label for="name" class="control-label required-field">Product Name</label>
                <input type="text" name="name" id="name" class="form-control form-control-sm rounded-0" value="{% if product.name %}{{product.name}}{% endif %}" required>
            </div>
            
            <!-- Description Field -->
            <div class="form-group mb-3">
                <label for="description" class="control-label required-field">Description</label>
                <textarea rows="5" name="description" id="description" class="form-control form-control-sm rounded-0" required>{% if product.description %}{{product.description}}{% endif %}</textarea>
            </div>
            
            <!-- Price Field -->
            <div class="form-group mb-3">
                <label for="price" class="control-label required-field">Price</label>
                <div class="input-group">
                    <span class="input-group-text">KSh</span>
                    <input type="number" step="0.01" min="0" name="price" id="price" class="form-control form-control-sm rounded-0" value="{% if product.price %}{{product.price}}{% endif %}" required>
                </div>
            </div>
            
            <!-- Status Field -->
            <div class="form-group mb-3">
                <label for="status" class="control-label required-field">Status</label>
                <select name="status" id="status" class="form-select form-select-sm rounded-0" required>
                    {% if product.status and product.status == 1 %}
                    <option value="1" selected>Active</option>
                    {% else %}
                    <option value="1">Active</option>
                    {% endif %}

                    {% if product.status and product.status == 0 %}
                    <option value="0" selected>Inactive</option>
                    {% else %}
                    <option value="0">Inactive</option>
                    {% endif %}
                </select>
            </div>
            
            <!-- Form Actions -->
            <div class="form-group mb-3 text-end">
                <button type="button" class="btn btn-secondary btn-sm rounded-0" data-bs-dismiss="modal">Cancel</button>
                <button type="submit" class="btn btn-primary btn-sm rounded-0">Save Product</button>
            </div>
        </form>
    </div>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
    $(function() {
        // Image preview functionality
        $('#image').change(function() {
            const file = this.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    $('#image-preview').attr('src', e.target.result).removeClass('d-none');
                    $('#image-placeholder').addClass('d-none');
                }
                reader.readAsDataURL(file);
            }
        });
        
        // Handle image removal
        $('#image-clear').change(function() {
            if (this.checked) {
                $('#image-preview').addClass('d-none');
                $('#image-placeholder').removeClass('d-none');
            } else {
                $('#image-preview').removeClass('d-none');
                $('#image-placeholder').addClass('d-none');
            }
        });
        
        // Form submission
        $('#product-form').submit(function(e) {
            e.preventDefault();
            var _this = $(this);
            $('.err-msg').remove();
            var el = $('<div>');
            el.addClass("alert alert-danger err-msg");
            el.hide();
            
            // Remove code field validation for new products
            var isNewProduct = !$('input[name="id"]').val();
            if (isNewProduct) {
                $('#code').removeAttr('required');
            }
            
            // Validate file size (max 2MB)
            var imageInput = document.getElementById('image');
            if (imageInput.files.length > 0) {
                var fileSize = imageInput.files[0].size / 1024 / 1024; // in MB
                if (fileSize > 2) {
                    alert('Image size must be less than 2MB');
                    return false;
                }
            }
            
            if (_this[0].checkValidity() == false) {
                _this[0].reportValidity();
                return false;
            }
            start_loader();
            
            // Create FormData and exclude code for new products
            var formData = new FormData($(this)[0]);
            if (isNewProduct) {
                formData.delete('code'); // Remove code field for new products
            }
            
            $.ajax({
                headers: {
                    "X-CSRFToken": '{{csrf_token}}'
                },
                url: "{% url 'save-product-page' %}",
                data: formData,
                cache: false,
                contentType: false,
                processData: false,
                method: 'POST',
                type: 'POST',
                dataType: 'json',
                error: err => {
                    console.log(err);
                    alert('An error occurred while saving the product.');
                    end_loader();
                },
                success: function(resp) {
                    if (typeof resp == 'object' && resp.status == 'success') {
                        el.removeClass("alert alert-danger err-msg");
                        // Show success message
                        alert('Product saved successfully!');
                        // Close modal or redirect as needed
                        if (typeof window.parent.$ === 'function') {
                            window.parent.$('.modal').modal('hide');
                        }
                        // Reload the page or update the product list
                        if (typeof window.parent.updateProductList === 'function') {
                            window.parent.updateProductList();
                        } else {
                            location.reload();
                        }
                    } else if (resp.status == 'failed' && !!resp.msg) {
                        el.text(resp.msg);
                        _this.prepend(el);
                        el.show('slow');
                        $("html, body, .modal").scrollTop(0);
                    } else {
                        el.text("An error occurred");
                        _this.prepend(el);
                        el.show('slow');
                        console.error(resp);
                    }
                    end_loader();
                }
            });
        });
        
        // Function to show loader (implement based on your existing code)
        function start_loader() {
            // Your loader implementation
            $('.loader').show() || $('#loader').show() || console.log('Loader started');
        }
        
        // Function to hide loader (implement based on your existing code)
        function end_loader() {
            // Your loader implementation
            $('.loader').hide() || $('#loader').hide() || console.log('Loader ended');
        }
    });
    </script>
</body>
</html>
